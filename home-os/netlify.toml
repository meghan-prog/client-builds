[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Explicit plugin entry (rather than relying on auto-detection) because
# this repo has a "base directory" set in Netlify's UI — auto-detection
# of the Next.js Runtime can be unreliable in that setup.
#
# Required environment variables (set in Netlify: Site configuration ->
# Environment variables):
#   TURSO_DATABASE_URL   libsql://<your-db>.turso.io
#   TURSO_AUTH_TOKEN     from `turso db tokens create <your-db>`
#
# Without these the app falls back to a local SQLite file, which does not
# persist on Netlify's serverless functions — set them before first deploy.
