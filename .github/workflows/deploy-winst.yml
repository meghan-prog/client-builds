name: Deploy winst.ai

on:
  push:
    branches: [main]
    paths: ['winst/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy winst.ai
        run: |
          npx wrangler pages deploy winst \
            --project-name=websitenl \
            --branch=main \
            --commit-dirty=true

      - name: Done
        run: |
          echo "================================================"
          echo "  LIVE: https://winst.ai"
          echo "================================================"
